<!DOCTYPE html>
<html lang="pt-br">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Seleção de perfis Netflix">
	<title>Netflix - Quem está assistindo?</title>
	<link rel="stylesheet" href="style.css">
</head>

<body>
	<button type="button" class="theme-toggle" id="themeToggle"
		aria-label="Alternar entre modo claro e escuro">☀️</button>

	<main>
		<h1>Quem está assistindo?</h1>

		<section class="profiles">
			<ul role="list">
				<li role="listitem">
					<article class="profile">
						<a href="./catalogo/catalogo.html">
							<figure>
								<img src="assets/dog.png" alt="Perfil Moa">
								<figcaption>Moa</figcaption>
							</figure>
						</a>
					</article>
				</li>
				<li role="listitem">
					<article class="profile">
						<a href="./catalogo/catalogo.html">
							<figure>
								<img src="assets/cat.png" alt="Perfil Rafa">
								<figcaption>Rafa</figcaption>
							</figure>
						</a>
					</article>
				</li>
				<li role="listitem">
					<article class="profile">
						<a href="./catalogo/catalogo.html">
							<figure>
								<img src="assets/inseticide.png" alt="Perfil Infantil">
								<figcaption>Infantil</figcaption>
							</figure>
						</a>
					</article>
				</li>
				<li role="listitem">
					<article class="profile add-profile">
						<figure>
							<img src="assets/addIcon.png" alt="Adicionar novo perfil">
							<figcaption>Adicionar Perfil</figcaption>
						</figure>
					</article>
				</li>
			</ul>
		</section>

		<button type="button" class="manage-profiles-btn">Gerenciar perfis</button>
	</main>

	<script src="/js/index.js"></script>
	<script src="script.js"></script>
</body>

</html>
